  <!-- Tipografía Inter -->
  <link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)">
  <link rel="preconnect" href="[fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
  <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap)" rel="stylesheet">

  <style>
    :root {
      --bg-principal: #F5F7FA;
      --acento:       #6C63FF;
      --texto:        #222222;
      --borde:        #E1E5EC;
      --card:         #FFFFFF;
      --radio:        14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-principal);
      color: var(--texto);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 48px 20px;
      line-height: 1.5;
    }

    .contenedor {
      width: 100%;
      max-width: 420px;
    }

    /* --- Cabecera del perfil --- */
    .perfil {
      text-align: center;
      margin-bottom: 32px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background-color: var(--card);
      border: 1px solid var(--borde);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 34px;
      font-weight: 700;
      color: var(--acento);
    }

    .perfil h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .perfil p {
      font-size: 14px;
      color: #555;
      font-weight: 400;
    }

    /* --- Lista de enlaces --- */
    .enlaces {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .enlace {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card);
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      padding: 16px 20px;
      text-decoration: none;
      color: var(--texto);
      font-size: 15px;
      font-weight: 500;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .enlace:hover {
      border-color: var(--acento);
      transform: translateY(-2px);
    }

    .enlace .texto {
      display: flex;
      flex-direction: column;
    }

    .enlace .texto small {
      font-size: 12px;
      font-weight: 400;
      color: #888;
    }

    .enlace .icono {
      width: 26px;
      height: 26px;
      color: var(--acento);
      flex-shrink: 0;
    }

    /* --- Pie --- */
    footer {
      text-align: center;
      margin-top: 36px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
